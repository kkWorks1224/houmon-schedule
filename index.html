<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="訪問予定" />
    <meta name="description" content="○○訪問看護ステーションの訪問スケジュール" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* JS 読み込み前から出す全画面スケルトン */
      #boot { position: fixed; inset: 0; z-index: 100; background: #f5f6f8; padding: calc(env(safe-area-inset-top) + 14px) 16px 0; }
      #boot .b { position: relative; overflow: hidden; background: #eceef1; border-radius: 12px; margin-bottom: 10px; }
      #boot .b::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%); background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); animation: bk 1.2s linear infinite; }
      #boot .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
      #boot .strip { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 4px 0 14px; }
      #boot .tab { position: fixed; left: 12px; right: 86px; bottom: max(10px, env(safe-area-inset-bottom)); height: 62px; border-radius: 999px; background: rgba(255,255,255,.7); box-shadow: 0 10px 30px rgba(15,23,42,.1); }
      #boot .fab { position: fixed; right: 12px; bottom: max(10px, env(safe-area-inset-bottom)); width: 62px; height: 62px; border-radius: 999px; background: #0a6ce0; opacity: .25; }
      #boot .side { display: none; }
      @keyframes bk { to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { #boot .b::after { animation: none; } }
      @media (min-width: 1024px) {
        #boot { padding: 24px 32px 0 264px; }
        #boot .side { display: block; position: fixed; left: 0; top: 0; bottom: 0; width: 232px; background: rgba(255,255,255,.7); border-right: 1px solid rgba(29,29,31,.08); padding: 20px; }
        #boot .tab, #boot .fab, #boot .strip { display: none; }
        #boot .cols { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
      }
    </style>
    <title>訪問スケジュール｜○○訪問看護ステーション</title>
  </head>
  <body>
    <div id="boot" aria-busy="true" aria-label="読み込み中">
      <div class="side"><div class="b" style="height: 20px; width: 160px"></div><div class="b" style="height: 44px; border-radius: 999px; margin-top: 24px"></div><div class="b" style="height: 40px"></div><div class="b" style="height: 40px"></div><div class="b" style="height: 40px"></div></div>
      <div class="row"><div class="b" style="width: 176px; height: 30px; margin: 0"></div><div class="b" style="width: 110px; height: 36px; border-radius: 999px; margin: 0"></div></div>
      <div class="b" style="height: 34px; border-radius: 999px"></div>
      <div class="strip"><div class="b" style="height: 58px"></div><div class="b" style="height: 58px"></div><div class="b" style="height: 58px"></div><div class="b" style="height: 58px"></div><div class="b" style="height: 58px"></div><div class="b" style="height: 58px"></div><div class="b" style="height: 58px"></div></div>
      <div class="cols"><div class="b" style="height: 76px; border-radius: 18px"></div><div class="b" style="height: 76px; border-radius: 18px"></div><div class="b" style="height: 76px; border-radius: 18px"></div><div class="b" style="height: 76px; border-radius: 18px"></div><div class="b" style="height: 76px; border-radius: 18px"></div></div>
      <div class="tab"></div><div class="fab"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
